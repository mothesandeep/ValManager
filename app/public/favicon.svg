<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241408"/>
      <stop offset="100%" stop-color="#0e0703"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="yarnBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FEF3C7"/>
      <stop offset="75%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Spool / Bobbin Body -->
  <g id="spool" transform="translate(14, 10)">
    <!-- Top Flange -->
    <ellipse cx="18" cy="6" rx="15" ry="4" fill="url(#goldGrad)"/>
    <ellipse cx="18" cy="5" rx="15" ry="4" fill="url(#goldLight)"/>
    <ellipse cx="18" cy="5" rx="5" ry="2" fill="#1c0f05"/>

    <!-- Central Wound Yarn (Kasab/Val) -->
    <path d="M5 5.5 L6.5 36.5 C6.5 40 29.5 40 29.5 36.5 L31 5.5 Z" fill="url(#yarnBody)"/>

    <!-- Thread Ridges / Precision Windings -->
    <path d="M5.5 12 C11 14.5 25 14.5 30.5 12" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
    <path d="M6 18 C11.5 20.5 24.5 20.5 30 18" stroke="#FEF3C7" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>
    <path d="M6.3 24 C11.8 26.5 24.2 26.5 29.7 24" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
    <path d="M6.5 30 C12 32.5 24 32.5 29.5 30" stroke="#FEF3C7" stroke-width="1.2" stroke-linecap="round" opacity="0.9"/>

    <!-- Bottom Flange -->
    <ellipse cx="18" cy="38" rx="16" ry="4.5" fill="url(#goldGrad)"/>
    <ellipse cx="18" cy="37" rx="16" ry="4.5" fill="url(#goldLight)"/>
    <ellipse cx="18" cy="37" rx="5.5" ry="2.2" fill="#1c0f05"/>

    <!-- Golden Sparkle (Zari Shimmer) -->
    <path d="M30 6 Q33 1 36 6 Q41 9 36 12 Q33 17 30 12 Q25 9 30 6 Z" fill="url(#goldLight)" filter="url(#glow)"/>
  </g>
</svg>