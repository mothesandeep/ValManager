<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24160a" />
      <stop offset="1" stop-color="#0B0704" />
    </linearGradient>
    <linearGradient id="goldThread" x1="0" y1="14" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6b4412" />
      <stop offset="15%" stop-color="#FCE38A" />
      <stop offset="30%" stop-color="#FFF2C8" />
      <stop offset="50%" stop-color="#C48E33" />
      <stop offset="75%" stop-color="#F4D068" />
      <stop offset="100%" stop-color="#4A2F0B" />
    </linearGradient>
    <linearGradient id="goldThreadEnd" x1="0" y1="17" x2="0" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#57360e" />
      <stop offset="15%" stop-color="#e3c874" />
      <stop offset="30%" stop-color="#e5d8af" />
      <stop offset="50%" stop-color="#a8792a" />
      <stop offset="75%" stop-color="#d1b052" />
      <stop offset="100%" stop-color="#362208" />
    </linearGradient>
    <linearGradient id="tubeGrad" x1="0" y1="26" x2="0" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9CA3AF" />
      <stop offset="20%" stop-color="#F3F4F6" />
      <stop offset="80%" stop-color="#D1D5DB" />
      <stop offset="100%" stop-color="#4B5563" />
    </linearGradient>
    <pattern id="threadPattern" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#52320a" stroke-width="0.8" opacity="0.5" />
      <line x1="2" y1="0" x2="2" y2="4" stroke="#FFFFFF" stroke-width="0.4" opacity="0.3" />
    </pattern>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="63" height="63" x="0.5" y="0.5" rx="15.5" stroke="url(#goldThread)" stroke-opacity="0.3" />
  <rect width="61" height="61" x="1.5" y="1.5" rx="14.5" stroke="#FFFFFF" stroke-opacity="0.04" />

  <g filter="url(#dropShadow)">
    <path d="M 8,28 L 16,27.5 L 16,36.5 L 8,36 Z" fill="url(#tubeGrad)" />
    <ellipse cx="8" cy="32" rx="1.5" ry="4" fill="#F3F4F6" />
    
    <path d="M 46,26 L 55,27 L 55,37 L 46,38 Z" fill="url(#tubeGrad)" />
    <ellipse cx="55" cy="32" rx="3" ry="5" fill="#E5E7EB" />
    <ellipse cx="55.5" cy="32" rx="1.5" ry="3.5" fill="#1c1108" />

    <ellipse cx="16" cy="32" rx="4" ry="15" fill="url(#goldThreadEnd)" />
    <ellipse cx="16" cy="32" rx="4" ry="15" fill="url(#threadPattern)" opacity="0.6" />

    <path d="M 16,17 Q 31,14 46,17 L 46,47 Q 31,50 16,47 Z" fill="url(#goldThread)" />
    <path d="M 16,17 Q 31,14 46,17 L 46,47 Q 31,50 16,47 Z" fill="url(#threadPattern)" />

    <ellipse cx="46" cy="32" rx="4" ry="15" fill="url(#goldThreadEnd)" />
    <ellipse cx="46" cy="32" rx="4" ry="15" fill="url(#threadPattern)" opacity="0.6" />

    <path d="M 22,15.5 Q 20,32 24,48.5" fill="none" stroke="#4a2e0c" stroke-width="1" opacity="0.6" />
    <path d="M 30,14.5 Q 28,32 32,49.5" fill="none" stroke="#4a2e0c" stroke-width="1" opacity="0.6" />
    <path d="M 38,15.5 Q 36,32 40,48.5" fill="none" stroke="#4a2e0c" stroke-width="1" opacity="0.6" />
    
    <path 
      d="M 32,49.5 C 36,54 44,52 48,56" 
      fill="none" 
      stroke="url(#goldThread)" 
      stroke-width="1.5" 
      stroke-linecap="round"
      filter="url(#glow)"
    />
    <path 
      d="M 32,49.5 C 36,54 44,52 48,56" 
      fill="none" 
      stroke="#FFFFFF" 
      stroke-width="0.5" 
      stroke-linecap="round"
      opacity="0.7"
    />
  </g>
</svg>