<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Squircle Gradient: slate-900 via zinc-900 to black -->
    <linearGradient id="valBgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Ring border highlight -->
    <linearGradient id="valRingGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <!-- Metallic Spindle / Core Cylinder Gradient -->
    <linearGradient id="valCoreGrad" x1="0" y1="28" x2="0" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="60%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Metallic Flange Discs -->
    <linearGradient id="valFlangeGrad" x1="0" y1="18" x2="0" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="20%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="80%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Golden Zari / Val Thread Gradient: from-amber-400 via-amber-300 to-amber-500 -->
    <linearGradient id="valZariGrad" x1="0" y1="18" x2="0" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="18%" stop-color="#fbbf24" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="65%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Thread Wound Texture / Grooves -->
    <linearGradient id="valThreadFlow" x1="32" y1="45" x2="55" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Soft Ambient Core Glow -->
    <radialGradient id="valGoldGlow" cx="32" cy="32" r="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Squircle Container with subtle dark gradient -->
  <rect width="64" height="64" rx="16" fill="url(#valBgGrad)" />
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" fill="none" stroke="url(#valRingGrad)" stroke-width="1" />

  <!-- Soft Gold Ambient Center Glow -->
  <circle cx="32" cy="32" r="22" fill="url(#valGoldGlow)" />

  <!-- 2. Metallic Spool Core & Spindles -->
  <!-- Left spindle shaft -->
  <path d="M 9,28.5 L 16,28.5 L 16,35.5 L 9,35.5 Z" fill="url(#valCoreGrad)" />
  <ellipse cx="9" cy="32" rx="1.5" ry="3.5" fill="#94a3b8" />

  <!-- Right spindle shaft -->
  <path d="M 48,28.5 L 55,28.5 L 55,35.5 L 48,35.5 Z" fill="url(#valCoreGrad)" />
  <ellipse cx="55" cy="32" rx="1.8" ry="3.5" fill="#cbd5e1" />
  <ellipse cx="55" cy="32" rx="0.8" ry="1.8" fill="#0f172a" />

  <!-- Left Flange Disc -->
  <ellipse cx="16" cy="32" rx="2.8" ry="13.5" fill="url(#valFlangeGrad)" />
  <ellipse cx="16" cy="32" rx="1.2" ry="13.5" fill="#f8fafc" opacity="0.3" />

  <!-- 3. Wound Golden Zari/Val Thread Body (Rich Volume & Curvature) -->
  <path
    d="M 16,19 C 26,17.2 38,17.2 48,19 L 48,45 C 38,46.8 26,46.8 16,45 Z"
    fill="url(#valZariGrad)"
  />

  <!-- Right Flange Disc -->
  <ellipse cx="48" cy="32" rx="2.8" ry="13.5" fill="url(#valFlangeGrad)" />

  <!-- Thread Winding Grooves / Texture -->
  <path d="M 23,18.5 Q 22,32 23.5,45.5" fill="none" stroke="#b45309" stroke-width="1.1" stroke-linecap="round" opacity="0.45" />
  <path d="M 31,18 Q 30,32 31.5,46" fill="none" stroke="#b45309" stroke-width="1.1" stroke-linecap="round" opacity="0.45" />
  <path d="M 39,18.5 Q 38,32 39.5,45.5" fill="none" stroke="#b45309" stroke-width="1.1" stroke-linecap="round" opacity="0.45" />

  <!-- Top Sheen / Specular Light Reflection -->
  <path
    d="M 19,22.5 C 28,21.2 36,21.2 45,22.5"
    fill="none"
    stroke="#ffffff"
    stroke-width="1.2"
    stroke-linecap="round"
    opacity="0.55"
  />

  <!-- 4. Dynamic Delivery / Dispatch Flowing Thread Stroke -->
  <!-- Subtle shadow for thread stroke -->
  <path
    d="M 32,46 C 36,51.5 45,52 54,45"
    fill="none"
    stroke="#000000"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.35"
  />
  <!-- Main flowing golden thread stroke -->
  <path
    d="M 32,46 C 36,51.5 45,52 54,45"
    fill="none"
    stroke="url(#valThreadFlow)"
    stroke-width="2.2"
    stroke-linecap="round"
  />
  <!-- High sheen core of thread stroke -->
  <path
    d="M 34,47 C 38,51.5 45,51.5 53,45.5"
    fill="none"
    stroke="#ffffff"
    stroke-width="0.8"
    stroke-linecap="round"
    opacity="0.85"
  />

  <!-- Thread Tip Spark / Glow Accent -->
  <circle cx="54" cy="45" r="2" fill="#fde047" />
  <circle cx="54" cy="45" r="3.5" fill="#fbbf24" opacity="0.4" />
</svg>